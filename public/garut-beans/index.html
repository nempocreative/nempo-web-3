    <style>
      #gb-initial-loader,
      #gb-initial-loader *,
      #gb-initial-loader *::before,
      #gb-initial-loader *::after {
        box-sizing: border-box;
      }

      #gb-initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff9f1;
        background:
          radial-gradient(ellipse at 50% 43%, rgba(211, 161, 95, .18), transparent 38%),
          radial-gradient(ellipse at 50% 46%, rgba(168, 84, 59, .38), transparent 52%),
          linear-gradient(150deg, #35251f 0%, #281e1a 62%, #211916 100%);
        font-family: Manrope, 'Trebuchet MS', sans-serif;
        opacity: 1;
        visibility: visible;
        transform: scale(1);
        filter: blur(0);
        transition: opacity .44s cubic-bezier(.22, .72, .2, 1), visibility .44s ease, transform .44s cubic-bezier(.22, .72, .2, 1), filter .44s ease;
      }

      #gb-initial-loader::before {
        position: absolute;
        inset: 0;
        content: '';
        pointer-events: none;
        background-image:
          radial-gradient(circle at 15% 24%, rgba(255, 216, 77, .22) 0 1px, transparent 1.6px),
          radial-gradient(circle at 82% 70%, rgba(255, 249, 241, .16) 0 1px, transparent 1.6px),
          radial-gradient(circle at 76% 18%, rgba(255, 216, 77, .13) 0 1px, transparent 1.6px);
        animation: gb-loader-ambient 8s ease-in-out infinite alternate;
      }

      #gb-initial-loader::after {
        position: absolute;
        inset: 0;
        content: '';
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 48%, rgba(255, 216, 77, .08), transparent 28%);
        animation: gb-loader-ambient 3.2s ease-in-out infinite alternate;
      }

      #gb-initial-loader.is-hiding {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(1.025);
        filter: blur(7px);
      }

      .gb-loader-content {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        width: min(100% - 32px, 360px);
        padding: 28px 20px;
        text-align: center;
        animation: gb-loader-arrive .65s cubic-bezier(.2, .75, .2, 1) both;
      }

      .gb-loader-emblem {
        position: relative;
        display: grid;
        width: 146px;
        height: 146px;
        place-items: center;
        border: 1px solid rgba(255, 249, 241, .12);
        border-radius: 50%;
        background: radial-gradient(circle, #61402f 0%, #3d2b24 58%, #30231e 100%);
        box-shadow: 0 0 0 12px rgba(255, 249, 241, .025), 0 20px 55px rgba(13, 9, 7, .32);
        animation: gb-loader-emblem-glow 2.8s ease-in-out infinite;
      }

      .gb-loader-emblem::before {
        position: absolute;
        inset: 9px;
        border: 1px solid rgba(255, 249, 241, .11);
        border-radius: 50%;
        content: '';
      }

      .gb-loader-orbit {
        position: absolute;
        inset: -1px;
        border: 1px solid transparent;
        border-top-color: #ffd84d;
        border-right-color: rgba(211, 161, 95, .58);
        border-radius: 50%;
        animation: gb-loader-spin 2.4s linear infinite;
      }

      .gb-loader-orbit-dot {
        position: absolute;
        top: 11px;
        left: 50%;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffd84d;
        box-shadow: 0 0 14px rgba(255, 216, 77, .8);
        transform: translateX(-50%);
      }

      .gb-loader-bean {
        width: 76px;
        height: 76px;
        object-fit: contain;
        filter: brightness(1.62) saturate(.72) drop-shadow(0 7px 12px rgba(15, 9, 7, .3));
        animation: gb-loader-bean 2.1s ease-in-out infinite;
      }

      .gb-loader-brand {
        margin: 25px 0 0;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 2.4px;
        animation: gb-loader-rise .45s .08s both;
      }

      .gb-loader-brand span {
        color: #d3a15f;
      }

      .gb-loader-copy {
        margin: 8px 0 0;
        color: rgba(255, 249, 241, .68);
        font-size: 12px;
        letter-spacing: .1px;
        animation: gb-loader-rise .45s .16s both;
      }

      .gb-loader-track {
        width: 188px;
        height: 3px;
        margin-top: 25px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 249, 241, .13);
        animation: gb-loader-rise .45s .22s both;
      }

      .gb-loader-track span {
        display: block;
        width: 34%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #a8543b, #ffd84d);
        animation: gb-loader-progress 1.35s ease-in-out infinite;
      }

      .gb-loader-caption {
        margin-top: 11px;
        color: rgba(255, 249, 241, .42);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 1.8px;
        animation: gb-loader-rise .45s .28s both;
      }

      @keyframes gb-loader-ambient {
        from { opacity: .58; transform: scale(.98); }
        to { opacity: 1; transform: scale(1.04); }
      }

      @keyframes gb-loader-arrive {
        from { opacity: 0; transform: translateY(10px) scale(.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes gb-loader-rise {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes gb-loader-emblem-glow {
        0%, 100% { box-shadow: 0 0 0 12px rgba(255, 249, 241, .025), 0 20px 55px rgba(13, 9, 7, .32); }
        50% { box-shadow: 0 0 0 16px rgba(255, 249, 241, .045), 0 20px 62px rgba(13, 9, 7, .38); }
      }

      @keyframes gb-loader-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes gb-loader-bean {
        0%, 100% { transform: translateY(2px) rotate(-8deg); }
        50% { transform: translateY(-5px) rotate(8deg); }
      }

      @keyframes gb-loader-progress {
        0% { transform: translateX(-125%); }
        100% { transform: translateX(395%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #gb-initial-loader { transition-duration: .01ms; }
        .gb-loader-content,
        .gb-loader-brand,
        .gb-loader-copy,
        .gb-loader-track,
        .gb-loader-caption { animation: none; }
        .gb-loader-orbit,
        .gb-loader-bean,
        .gb-loader-track span,
        .gb-loader-emblem,
        #gb-initial-loader::before,
        #gb-initial-loader::after { animation: none; }
      }

        window.setTimeout(() => {
          if (!loader.isConnected) return;
          loader.classList.add('is-hiding');
          window.setTimeout(() => {
            loader.remove();
            const root = document.getElementById('root');
            root?.removeAttribute('aria-hidden');
            root?.removeAttribute('inert');
          }, 650);
        }, 15000);
      })();
    </script>
  </body>
</html>
